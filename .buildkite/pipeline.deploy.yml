env:
  BUILDKIT_PROGRESS: plain

steps:
  - name: ":docker::ecr: Push to ECR"
    command: ".buildkite/push-image.sh"
    depends_on: "rspec"
    key: "ecr-push"
    if: |
      build.branch == "main"
    agents:
      queue: hosted
    plugins:
      - aws-assume-role-with-web-identity#v1.8.1:
          role-arn: arn:aws:iam::${ECR_ACCOUNT_ID}:role/pipeline-buildkite-docs-private
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: ${ECR_ACCOUNT_ID}

  - name: ":ecr: ECR Vulnerabilities Scan"
    command: "true"
    soft_fail:
      - exit_status: 75 # soft fail for scan timeouts
    agents:
      queue: hosted
    depends_on: "ecr-push"
    plugins:
      - aws-assume-role-with-web-identity#v1.8.1:
          role-arn: arn:aws:iam::${ECR_ACCOUNT_ID}:role/pipeline-buildkite-docs-private
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - cultureamp/ecr-scan-results#v1.9.1:
          image-name: "${ECR_REPO}:${BUILDKITE_BUILD_NUMBER}"
          fail-build-on-plugin-failure: true

  # If the current user is part of the deploy team, then wait for everything to
  # finish before deploying
  - wait: ~
    key: "deploy-check-wait"
    depends_on: "ecr-push"
    if: "(build.creator.teams includes 'deploy') && build.branch == 'main'"

  # If the user *isn't* in the deploy team, require a block step for manual
  # verification by someone who is in the team.
  - block: ":rocket: Deploy"
    key: "deploy-check-block"
    depends_on: "ecr-push"
    if: "!(build.creator.teams includes 'deploy') && build.branch == 'main'"

  - label: ":docker::rocket:"
    key: "deploy-ecs"
    branches: main
    depends_on:
      - "deploy-check-wait"
      - "deploy-check-block"
    concurrency: 1
    concurrency_group: docs-deploy
    agents:
      queue: hosted
    command: scripts/deploy-ecs
    plugins:
      - aws-assume-role-with-web-identity#v1.8.1:
          role-arn: arn:aws:iam::${ECR_ACCOUNT_ID}:role/pipeline-buildkite-docs-private
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch

  # EKS migration (PB-3918). Runs after the ECS deploy so both backends serve
  # the same image while traffic is split between them.
  - label: ":kubernetes::rocket: Deploy to EKS"
    key: "deploy-eks"
    branches: main
    depends_on: "deploy-ecs"
    concurrency: 1
    concurrency_group: docs-deploy-eks
    agents:
      queue: deploy
    command: scripts/deploy-eks
    env:
      # Pin the same helm-deploy build as buildkite/buildkite.
      HELM_DEPLOY_IMAGE: "${ECR_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/helm-deploy:246"
      # The commit of buildkite/internal-charts to deploy charts/docs from.
      INTERNAL_CHARTS_REF: "a9d1ac1c1c0954cc9775773a39d80c1bf1487230"
      # TAILSCALE_CLIENT_ID, TAILSCALE_TAGS and TAILSCALE_VERIFY_PEER_TAG come
      # from the pipeline env in buildkite/saas-iac, so they aren't mirrored to
      # the public docs repo.
    plugins:
      # Assumes pipeline-buildkite-docs-private with the default session tags,
      # logs in to ECR, and supplies GH_TOKEN from Exchange. This pipeline's
      # Exchange policy in buildkite/ops limits the token to reading
      # buildkite/internal-charts.
      - buildkite/just-works#v0.2.0:
          account-id: "${ECR_ACCOUNT_ID}"
          ecr:
            accounts: ["${ECR_ACCOUNT_ID}"]
            region: us-east-1
          ssm:
            enabled: false
          github:
            changes-enabled: true
      - docker-compose#v5.16.0:
          run: helm-deploy
          config: .buildkite/docker-compose.helm-deploy.yml
          mount-checkout: true
          mount-buildkite-agent: true
          propagate-environment: true
          propagate-aws-auth-tokens: true
          environment:
            - GH_TOKEN
