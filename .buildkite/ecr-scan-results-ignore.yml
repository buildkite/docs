  # --- glibc (no fix in Bookworm or Trixie; affected paths are unreachable in this image) ---
  - id: CVE-2026-84243 # glibc 2.41-12+deb13u4
    reason: |
      Requires an attacker-controlled LANGUAGE environment variable and an installed LC_MESSAGES locale other than C, C.<encoding>, or POSIX. The runtime image has only C, C.utf8, and POSIX locales, so gettext does not use LANGUAGE. No additional locales are installed by the application.

      https://sourceware.org/git/?p=glibc.git;a=blob_plain;f=advisories/GLIBC-SA-2026-0025
  - id: CVE-2026-5450 # glibc 2.41-12+deb13u3
    reason: |
      Needs a scanf-family call whose format contains `%mc` or `%mC` with an explicit field width above 1024, which under-allocates by one byte in `__vfscanf_internal`. Upstream's regression test is `"%1040mc"`.

      Searching every file in the image against the full glibc grammar — `%` `[N$]` `[*'I]*` `[width]` `m` `[l]` conversion, so positional forms like `%1$1040mc` are included — returns no `c`/`C` match with any width at all. Every allocating `c`/`C` conversion present is width-free (`%mc` in node; `%mC` in libruby, cp949.so and gbk.so), and no positional allocating conversion exists anywhere.

      libruby imports no scanf-family symbol at all, so no request-driven input reaches `__vfscanf_internal`. Ruby's scanf stdlib is also absent (`require "scanf"` raises LoadError).

      A format assembled at runtime would escape a static scan; the import evidence is what rules out the serving path. Debian rates this <no-dsa> (Minor issue) in both Bookworm and Trixie, and upstream notes `%[width]mc` "does not appear to have notable use in major Linux-based OS distributions".

      https://sourceware.org/git/?p=glibc.git;a=blob_plain;f=advisories/GLIBC-SA-2026-0009
  - id: CVE-2026-5928 # glibc 2.41-12+deb13u3
    reason: |
      Needs `ungetwc()` on a wide-character FILE stream in an encoding whose single-byte and multi-byte forms overlap.

      Exactly one object in the image imports `ungetwc`: libstdc++. The serving process never loads it — libruby lists only libc.so.6 as NEEDED, and neither the ruby binary nor nokogiri.so links libstdc++. The app is UTF-8 throughout.
  - id: CVE-2026-19499 # glibc 2.41-12+deb13u4
    reason: |
      Needs a caller that passes `strfmon` or `strfmon_l` a right-justified width into a buffer big enough for the padding but too small for the internal memmove.

      Checking the dynamic symbol table of every ELF file in the image (base image, node, node_modules and all gem extensions) finds `strfmon`, `strfmon_l` and `__strfmon_l` defined in libc.so.6 and imported by nothing. No gem extension source references either function.

      A call made at runtime through dlsym or Fiddle would escape this check, and the app makes none. Debian rates this <no-dsa> (Minor issue) in Trixie and upstream notes no known network-facing impact.

      https://sourceware.org/git/?p=glibc.git;a=blob;f=advisories/GLIBC-SA-2026-0017
  - id: CVE-2026-5435 # glibc 2.41-12+deb13u4
    reason: |
      Needs a call to the deprecated resolver debugging printers (`ns_sprintrr`, `ns_sprintrrf` or `fp_nquery`) on a TSIG record.

      In this glibc those are exported only by libresolv.so.2, as `ns_sprintrr`, `ns_sprintrrf` and `__fp_nquery`. No ELF file in the image imports any of them. The only objects that link libresolv at all are libnss_hesiod (not loaded: /etc/nsswitch.conf uses only `files` and `dns`) and sharp's libvips in node_modules (build tooling, not the serving process, and it does not import them either).

      Debian rates this <no-dsa> (Minor issue, debugging functions) in Trixie.

      https://sourceware.org/git/?p=glibc.git;a=blob_plain;f=advisories/GLIBC-SA-2026-0011

  # --- sqlite3 (present only because liblastlog2 links it; the app has no database) ---
  - id: CVE-2026-11822 # sqlite3 3.46.1-7+deb13u1
    reason: |
      FTS5 out-of-bounds read reached by running a MATCH query over an attacker-supplied database. This app opens no SQLite database: ActiveRecord is not loaded and libsqlite3 is pulled in only by liblastlog2, which nothing invokes.
  - id: CVE-2026-11824 # sqlite3 3.46.1-7+deb13u1
    reason: |
      FTS5 heap overflow reached by running a MATCH query over an attacker-supplied database. Unreachable for the same reason as CVE-2026-11822.
  - id: CVE-2026-39113 # sqlite3 3.46.1-7+deb13u1
    reason: |
      Denial of service in the sqlar extension's sqlar_uncompress(). Currently scored Undefined so it does not count against the threshold; listed so a later rescore does not break the build. Unreachable for the same reason as CVE-2026-11822.
  - id: CVE-2026-119586 # sqlite3 3.46.1-7+deb13u2
    reason: |
      Command injection requires piping the sqlite3 shell's .recover output from an attacker-supplied database into another sqlite3 shell. The runtime image has no sqlite3 executable. Only libsqlite3 is installed, as a dependency of liblastlog2.
  - id: CVE-2026-119379 # sqlite3 3.46.1-7+deb13u2
    reason: |
      Heap overflow requires applying an attacker-supplied changeset with sqlite3changeset_apply(). The app does not load ActiveRecord or a SQLite adapter, open SQLite databases, or apply changesets. libsqlite3 is present only as a dependency of liblastlog2.
  - id: CVE-2026-119374 # sqlite3 3.46.1-7+deb13u2
    reason: |
      FTS5 heap overflow requires deleting from an attacker-supplied database with secure-delete enabled. The app opens no SQLite databases and does not use FTS5. libsqlite3 is present only as a dependency of liblastlog2.
  - id: CVE-2026-119373 # sqlite3 3.46.1-7+deb13u2
    reason: |
      FTS5 heap overflow requires a prefix MATCH query over a detail=none table containing attacker-controlled negative rowids. The app opens no SQLite databases and does not use FTS5. libsqlite3 is present only as a dependency of liblastlog2.

  # --- zlib (gzip writer paths are unreachable or the vulnerable code is absent) ---
  - id: CVE-2026-76844 # zlib 1:1.3.dfsg+really1.3.1-1+b1
    reason: |
      Trixie's zlib 1.3.1 is affected, but reaching this overflow requires a gz* write error, a call to gzclearerr(), and another gz* write on the same stream. No ELF file in the runtime image imports gzclearerr(). The only importers of the system libz gzip writer API are dpkg-deb and libapt-pkg, neither of which the serving process loads or invokes.

      Ruby's zlib extension uses deflate/inflate directly, not the gz* file API. Node bundles its own zlib and does not link the system libz. The app does not resolve these functions dynamically. Debian has no fixed Trixie package yet; reassess this exception if gzip writer callers are added or the runtime changes.

      https://nvd.nist.gov/vuln/detail/CVE-2026-76844
      https://security-tracker.debian.org/tracker/CVE-2026-76844
  - id: CVE-2026-85091 # zlib 1:1.3.dfsg+really1.3.1-1+b1
    reason: |
      The overflow is in `gz_vacate()`, which upstream added in zlib 1.3.1.2 with non-blocking gz* support (madler/zlib@81cc0be). The advisory lists 1.3.1.2 through 1.3.2 as affected. Trixie ships 1.3.1 with no Debian patches, and its gzwrite.c contains no `gz_vacate` and no non-blocking handling, so the vulnerable code is absent. The scanner flags it because Debian's tracker still lists every release as vulnerable.

      Even if the code were present, no ELF file in the image imports `gzprintf` or `gzvprintf`. The only importers of the system libz gz* write API are dpkg-deb and libapt-pkg. Node and nokogiri bundle their own zlib.

      https://github.com/madler/zlib/issues/1310
