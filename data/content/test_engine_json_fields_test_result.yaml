fields:
- name: scope
  required: false
  type: string
  enumerated_values:
  desc: |
      A group or topic for the test
  examples:
      - Student.isEnrolled()
- name: name
  required: true
  type: string
  desc: |
      A name or description for the test
  examples:
      - Manager.isEnrolled() returns_boolean
- name: location
  required: false
  type: string
  enumerated_values:
  desc: |
      The path where the test originates. Optionally include a line number after a colon (`:`). Path-only values are valid. Buildkite Test Engine uses this top-level field for [test ownership](/docs/pipelines/configure/tests/test-suites/test-ownership) matching. A tag named `location` is not used for ownership. Each newer upload of the same test overwrites this field; omitting it clears any previous value.
  examples:
      - ./tests/Manager/isEnrolled.js:32
      - common/cpp
- name: file_name
  required: false
  type: string
  desc: |
      The file where the test originates
  examples:
      - ./tests/Manager/isEnrolled.js
- name: result
  required: false
  type: string
  enumerated_values:
      - passed
      - failed
      - skipped
      - unknown
  desc: |
      The outcome of the test
  examples:
      - failed
- name: failure_reason
  required: false
  type: string
  desc: |
       If applicable, a short summary of why the test failed
  examples:
      - Expected Boolean, got Object
- name: failure_expanded
  required: false
  type: array of hashes
  desc: |
       A more detailed explanation of why the test failed
  examples:

- name: history
  required: true
  type: history object
  desc: |
      Read [History objects](/docs/pipelines/configure/tests/test-collection/importing-json#json-test-results-data-reference-history-objects)

- name: tags
  required: false
  type: Key-value hash
  desc: |
      Read [Execution level custom tags](/docs/pipelines/configure/tests/test-collection/importing-json#json-test-results-data-reference-execution-level-custom-tags). Tags are not used for [test ownership](/docs/pipelines/configure/tests/test-suites/test-ownership); put ownership paths in the top-level `location` field instead.
  examples:
      - "{ \"team\": \"foobar\", \"feature\": \"frontend\" }"
