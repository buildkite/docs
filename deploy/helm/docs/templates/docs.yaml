---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  labels:
    app: docs
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
      annotations:
        ad.datadoghq.com/web.logs: '[{"source":"ruby","service":"docs"}]'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      # The image runs as root, as it does on ECS today.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: docs
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Same path the ECS target group health check uses.
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          # Rails writes its default file cache to tmp/ and may create log/.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
            - name: app-log
              mountPath: /app/log
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
        - name: app-log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  labels:
    app: docs
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app: docs
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: docs
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: docs
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docs
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    # Matches /docs and /docs/* (not /docsfoo). No prefix rewrite: the Rails
    # app serves everything under /docs.
    - matches:
        - path:
            type: PathPrefix
            value: /docs
      {{- if .Values.backendMarker }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Buildkite-Docs-Backend
                value: {{ .Values.backendMarker | quote }}
      {{- end }}
      backendRefs:
        - name: docs
          port: 3000
